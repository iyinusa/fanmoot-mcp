<!doctype html>
<!--
  ui://fanmoot/mood — `S6-5`, rendering what `S3-7` computed.

  One stacked bar, three numbers, and the takes behind them. The bar is the
  picture; the numbers are the answer. A reader who cannot tell the three
  colours apart loses nothing, because each segment is labelled with its word
  and its count underneath (`S6-7`) — a sentiment split that only exists as
  colour is a chart that says nothing to a quarter of the people looking at it.

  `method` is shown, and that is honesty rather than decoration: the labels
  come from a Bedrock call when one is configured and from an offline lexicon
  when one is not, and a reader deciding how much to trust a split should be
  told which they are looking at.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fanmoot mood</title>
    <style>
      __BASE_CSS__

      .bar {
        display: flex;
        height: 0.75rem;
        margin: 0.75rem 0 0.5rem;
        border-radius: var(--border-radius-full, 999px);
        overflow: hidden;
        background: var(--color-background-tertiary, var(--fm-raised));
      }
      .bar span {
        display: block;
        height: 100%;
      }
      .bar .positive {
        background: var(--color-background-success, var(--fm-green));
      }
      .bar .negative {
        background: var(--color-background-danger, var(--fm-red));
      }
      .bar .neutral {
        background: var(--color-border-secondary, var(--fm-faint));
      }
      .key {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem 1rem;
      }
      .key div {
        display: flex;
        align-items: baseline;
        gap: 0.375rem;
      }
      .swatch {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 3px;
        flex: none;
        align-self: center;
      }
      .swatch.positive {
        background: var(--color-background-success, var(--fm-green));
      }
      .swatch.negative {
        background: var(--color-background-danger, var(--fm-red));
      }
      .swatch.neutral {
        background: var(--color-border-secondary, var(--fm-faint));
      }
      .count {
        font-weight: var(--font-weight-semibold, 600);
        font-variant-numeric: tabular-nums;
      }
      .takes {
        margin-top: 0.75rem;
      }
      .takes li {
        padding: 0.5rem 0;
        border-top: 1px solid var(--color-border-primary, var(--fm-line));
      }
      .takes .handle {
        font-weight: var(--font-weight-semibold, 600);
      }
      .takes p {
        margin-top: 0.125rem;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="between">
        <h1 id="subject">The mood</h1>
        <span class="pill" id="method" hidden></span>
      </div>
      <p class="faint" id="summary">Reading the room.</p>

      <div class="bar" id="bar" role="img" aria-label="Sentiment split"></div>
      <div class="key" id="key"></div>

      <ul class="takes" id="takes" aria-label="Takes behind the split"></ul>
    </main>

    <script>
      __BRIDGE_JS__
    </script>
    <script>
      (function () {
        var subject = document.getElementById('subject');
        var method = document.getElementById('method');
        var summary = document.getElementById('summary');
        var bar = document.getElementById('bar');
        var key = document.getElementById('key');
        var takes = document.getElementById('takes');

        var LABELS = { positive: 'Happy', negative: 'Furious', neutral: 'Unmoved' };

        function text(tag, className, value) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (value != null) node.textContent = value;
          return node;
        }

        function drawBar(counts, total) {
          bar.replaceChildren();
          if (!total) return;
          ['positive', 'neutral', 'negative'].forEach(function (kind) {
            var count = counts[kind] || 0;
            if (!count) return;
            var segment = text('span', kind);
            segment.style.width = ((count / total) * 100).toFixed(1) + '%';
            bar.appendChild(segment);
          });
          bar.setAttribute(
            'aria-label',
            'Of ' +
              total +
              ' takes: ' +
              ['positive', 'neutral', 'negative']
                .map(function (kind) {
                  return (counts[kind] || 0) + ' ' + LABELS[kind].toLowerCase();
                })
                .join(', ')
          );
        }

        function drawKey(counts) {
          key.replaceChildren();
          ['positive', 'neutral', 'negative'].forEach(function (kind) {
            var entry = text('div');
            entry.appendChild(text('span', 'swatch ' + kind));
            entry.appendChild(text('span', 'count', String(counts[kind] || 0)));
            entry.appendChild(text('span', 'muted', LABELS[kind]));
            key.appendChild(entry);
          });
        }

        window.fanmoot(function (payload, result, view) {
          var counts = {
            positive: payload.positive || 0,
            negative: payload.negative || 0,
            neutral: payload.neutral || 0,
          };
          var total = counts.positive + counts.negative + counts.neutral;

          subject.textContent = payload.subject || 'The mood';
          summary.textContent = payload.summary || payload.spoken || '';

          if (payload.method) {
            method.hidden = false;
            method.textContent =
              payload.method === 'bedrock' ? 'read by a model' : 'read by lexicon';
          }

          drawBar(counts, total);
          drawKey(counts);

          takes.replaceChildren();
          (payload.takes || []).forEach(function (take) {
            var item = text('li');
            var byline = text('div', 'byline');
            byline.appendChild(text('span', 'handle', take.name || take.handle));
            byline.appendChild(text('span', 'faint', ' @' + take.handle));
            item.appendChild(byline);
            // textContent: a take is something a stranger said, never markup.
            item.appendChild(text('p', null, take.body));
            takes.appendChild(item);
          });

          if (!total) {
            takes.appendChild(text('li', 'empty', 'Nobody has said anything yet.'));
          }

          view.updateModelContext({ showing: 'mood', spoken: payload.spoken });
        });
      })();
    </script>
  </body>
</html>
