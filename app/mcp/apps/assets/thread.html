<!doctype html>
<!--
  ui://fanmoot/thread — `S6-3`. The one view that is not a picture of an answer.

  `read_match_conversation`, `read_thread` and `trending_takes` all render here,
  and under the takes there is a composer that calls `reply_to_moot` **through
  the host bridge** — `tools/call`, proxied by the host, on the same server
  connection and the same OAuth grant. That is what the extension is for: a fan
  reads the argument and answers it without leaving the card.

  Two things the composer has to be honest about, and both come straight from
  `S5`:

  * A reply Fanmoot holds for review is **not** live. `held` and `gate_reason`
    come back in the tool's own payload and are shown word for word.
  * A reply needs the account connected. When the host refuses the call — no
    grant, or a scope the fan never granted — the error says so and the text
    the fan typed stays in the box.

  Takes are strangers talking. They are inserted as text, never as markup, and
  every one is attributed to the handle that posted it.

  Each take is the shared moot card (`card.js`): crest, tier, pictures, link,
  quote and the chip back to its match. Every card has its own Reply button,
  and its reactions call `react_to_moot` through the host, the same way the
  composer calls `reply_to_moot`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fanmoot thread</title>
    <style>
      __BASE_CSS__
      __CARD_CSS__

      .composer {
        margin-top: 0.75rem;
        border-top: 1px solid var(--color-border-primary, var(--fm-line));
        padding-top: 0.75rem;
      }
      .composer .target {
        margin-bottom: 0.375rem;
      }
      .composer .actions {
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .outcome {
        font-size: var(--font-text-sm-size, 0.8125rem);
      }
      .outcome.bad {
        color: var(--color-text-danger, var(--fm-red-text));
      }
      .outcome.held {
        color: var(--color-text-warning, var(--fm-amber-text));
      }
      .outcome.good {
        color: var(--color-text-success, var(--fm-green-text));
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="subject">The conversation</h1>
      <p class="faint" id="summary">Waiting for the thread.</p>
      <div id="fixture"></div>

      <ul id="takes" aria-label="Takes from fans"></ul>

      <form class="composer" id="composer" hidden>
        <p class="faint target" id="target"></p>
        <label class="sr-only" for="reply">Your reply</label>
        <textarea
          id="reply"
          maxlength="1500"
          placeholder="Say something back…"
          aria-describedby="outcome"
        ></textarea>
        <div class="actions">
          <p class="outcome" id="outcome" role="status" aria-live="polite"></p>
          <button type="submit" id="send">Reply</button>
        </div>
      </form>
    </main>

    <script>
      __BRIDGE_JS__
    </script>
    <script>
      __CARD_JS__
    </script>
    <script>
      (function () {
        var card = window.fanmootCard;
        var subject = document.getElementById('subject');
        var summary = document.getElementById('summary');
        var fixture = document.getElementById('fixture');
        var list = document.getElementById('takes');
        var composer = document.getElementById('composer');
        var target = document.getElementById('target');
        var box = document.getElementById('reply');
        var send = document.getElementById('send');
        var outcome = document.getElementById('outcome');
        var replyingTo = null;
        var bridge = null;
        var inMatch = false;

        /** Point the composer at one take. Every card's Reply button lands
         *  here, so a fan answers the take they are looking at — not whichever
         *  one happened to be first. */
        function aim(take, focus) {
          replyingTo = take.short_id || take.id;
          var who = take.name || take.handle;
          target.textContent = 'Replying to ' + who + ' (@' + take.handle + ')';
          box.placeholder = 'Reply to ' + who + '…';
          box.setAttribute('aria-label', 'Reply to ' + who);
          composer.hidden = false;
          // Only when the fan asked. Focusing on render would pull the caret
          // out of the host's own message box the moment the card appeared.
          if (focus && box.focus) box.focus();
        }

        function cardOf(take) {
          return card.take(take, {
            view: bridge,
            tag: 'li',
            react: true,
            onReply: function (take) {
              aim(take, true);
            },
            // In a match's own thread, a chip back to that match is a link to
            // the page the fan is already on.
            match: !inMatch,
          });
        }

        function settle(message, kind) {
          outcome.textContent = message;
          outcome.className = 'outcome' + (kind ? ' ' + kind : '');
        }

        composer.addEventListener('submit', function (event) {
          event.preventDefault();
          var body = box.value.trim();
          if (!body || !replyingTo || !bridge) return;

          send.disabled = true;
          settle('Posting…');
          bridge
            .callTool('reply_to_moot', { take: replyingTo, body: body })
            .then(function (result) {
              var payload = (result && result.structuredContent) || {};
              if (result && result.isError) {
                // The tool's own sentence — "connect your account", "that take
                // is too long" — is already written for a fan (`S5-8`).
                settle(card.spoken(result) || 'That did not post.', 'bad');
                return;
              }
              if (payload.held) {
                settle(payload.gate_reason || 'Fanmoot is reviewing that before it goes live.', 'held');
              } else {
                settle('Posted.', 'good');
              }
              // The reply the tool answered with, on the card now — not on
              // the next read of the thread, which may never come.
              if (payload.take) list.appendChild(cardOf(payload.take));
              box.value = '';
            })
            .catch(function (error) {
              settle(error.message || 'That did not post.', 'bad');
            })
            .then(function () {
              send.disabled = false;
            });
        });

        window.fanmoot(function (payload, result, view) {
          bridge = view;

          // Three tools land here. `read_thread` answers with one take and its
          // replies; the other two answer with a list.
          var root = payload.take || null;
          var takes = payload.takes || payload.replies || [];
          if (root) takes = [root].concat(takes);

          var match = payload.match && payload.match.home && payload.match.away ? payload.match : null;
          inMatch = Boolean(match);
          fixture.replaceChildren();
          if (match) {
            subject.textContent = match.home.name + ' v ' + match.away.name;
            if (match.url) fixture.appendChild(card.link(match.url, 'open', 'Open the match on Fanmoot', view));
          } else if (root) {
            subject.textContent = 'The argument';
          } else {
            subject.textContent = 'What fans are saying';
          }
          summary.textContent = payload.spoken || '';

          list.replaceChildren();
          if (!takes.length) {
            list.appendChild(card.el('li', 'empty', 'Nobody has said anything yet.'));
          } else {
            takes.forEach(function (take) {
              list.appendChild(cardOf(take));
            });
          }

          // The composer starts aimed at the take the tool was about —
          // `read_thread` names it; for a room, the first one on screen.
          composer.hidden = true;
          if (root || takes[0]) aim(root || takes[0]);

          view.updateModelContext({ showing: 'thread', spoken: payload.spoken });
        });
      })();
    </script>
  </body>
</html>
