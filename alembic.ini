[alembic]
script_location = alembic
prepend_sys_path = .
# Dated, slugged filenames so `ls alembic/versions` reads as a history rather
# than a pile of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Overwritten at runtime from FMCP_DATABASE_URL by alembic/env.py — this
# placeholder exists only so alembic does not complain about a missing key.
sqlalchemy.url = driver://user:pass@localhost/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
