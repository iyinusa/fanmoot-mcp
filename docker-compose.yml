# Production stack for Dokploy.
#
# Two things about this file are load-bearing and easy to undo by accident:
#
#  1. There is NO `ports:` mapping. Dokploy's Traefik reverse proxy routes to
#     this container over the shared `dokploy-network` on its internal port.
#     Publishing 8080:8080 binds the host port and bypasses (or collides with)
#     Traefik — the classic "works locally, 502 in production" cause. It would
#     also collide with `fanmoot`, which sits on the same host.
#
#  2. Every FMCP_* variable is injected explicitly under `environment:`.
#     Dokploy passes configuration as environment variables through its UI, not
#     as a committed .env file, and `env_file:` alone would leave the container
#     with nothing when that file is absent. The `${VAR:-default}` form means a
#     variable the operator has not set falls back to a safe default rather
#     than an empty string.
#
# There is deliberately no `db:` service. This server targets a *remote*
# managed PostgreSQL with its own backups, and it is a small one: seven OAuth
# tables and nothing else (HAD-3). Fanmoot's own data is reached over its
# public API (HAD-1), so there is no second database to link here.

services:
  mcp:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # ── Environment & identity ──────────────────────────────────────────
      FMCP_ENV: ${FMCP_ENV:-production}
      FMCP_PUBLIC_BASE_URL: ${FMCP_PUBLIC_BASE_URL:-https://mcp.fanmoot.com}

      # ── Upstream Fanmoot (HAD-1) ────────────────────────────────────────
      FMCP_FANMOOT_API_BASE_URL: ${FMCP_FANMOOT_API_BASE_URL:-https://fanmoot.com}
      FMCP_FANMOOT_TIMEOUT_S: ${FMCP_FANMOOT_TIMEOUT_S:-8.0}

      # ── This server's own database (OAuth state only) ───────────────────
      FMCP_DATABASE_URL: ${FMCP_DATABASE_URL:-}
      FMCP_DB_POOL_SIZE: ${FMCP_DB_POOL_SIZE:-5}
      FMCP_DB_MAX_OVERFLOW: ${FMCP_DB_MAX_OVERFLOW:-10}

      # ── MCP transport (S2) ──────────────────────────────────────────────
      # Browser origins allowed to reach /mcp. This server's own origin is
      # always allowed; non-browser clients send no Origin and are unaffected.
      FMCP_MCP_ALLOWED_ORIGINS: ${FMCP_MCP_ALLOWED_ORIGINS:-}
      FMCP_MCP_SESSION_IDLE_TIMEOUT_S: ${FMCP_MCP_SESSION_IDLE_TIMEOUT_S:-1800}
      FMCP_MCP_MAX_SESSIONS: ${FMCP_MCP_MAX_SESSIONS:-500}

      # ── OAuth 2.1 authorization server (S4, HAD-4) ──────────────────────
      # The static, pre-seeded clients — tier 1 of HAD-5, which in practice
      # means Alexa, because Alexa has no dynamic registration. A JSON array,
      # upserted by client_id at every boot so a redeploy never orphans
      # credentials a fan has already linked against. Register EVERY redirect
      # URI from the Alexa+ Developer Hub: the presented one is matched exactly
      # and never substituted, and getting that wrong is the single most likely
      # cause of a silent account-linking failure (S4-5).
      FMCP_OAUTH_CLIENTS: ${FMCP_OAUTH_CLIENTS:-}

      # Tier 2 — everyone else (Claude, ChatGPT, Cursor, MCP Inspector) registers
      # itself. On by default: a public MCP server that cannot be self-registered
      # against is an Alexa add-on wearing an MCP costume (§2.2).
      FMCP_OAUTH_DCR_ENABLED: ${FMCP_OAUTH_DCR_ENABLED:-true}
      FMCP_OAUTH_DCR_CLIENT_TTL_DAYS: ${FMCP_OAUTH_DCR_CLIENT_TTL_DAYS:-30}

      # Access token 1 h, refresh 90 days (S4-7). Refresh tokens are mandatory
      # per Alexa's docs — without them a fan re-links on every expiry.
      FMCP_OAUTH_ACCESS_TOKEN_TTL_S: ${FMCP_OAUTH_ACCESS_TOKEN_TTL_S:-3600}
      FMCP_OAUTH_REFRESH_TOKEN_TTL_DAYS: ${FMCP_OAUTH_REFRESH_TOKEN_TTL_DAYS:-90}
      FMCP_OAUTH_CODE_TTL_S: ${FMCP_OAUTH_CODE_TTL_S:-60}
      FMCP_OAUTH_FLOW_TTL_S: ${FMCP_OAUTH_FLOW_TTL_S:-900}

      # Rate limits and lockout (S4-14). In process, which is correct while the
      # worker count above is 1.
      FMCP_OAUTH_LOGIN_LIMIT: ${FMCP_OAUTH_LOGIN_LIMIT:-10}
      FMCP_OAUTH_TOKEN_LIMIT: ${FMCP_OAUTH_TOKEN_LIMIT:-120}
      FMCP_OAUTH_REGISTER_LIMIT: ${FMCP_OAUTH_REGISTER_LIMIT:-5}

      # ── Secrets ─────────────────────────────────────────────────────────
      # Unset, the authenticated tools are simply off and /authorize answers
      # 503: a fan's Fanmoot session cannot be encrypted at rest, so it is
      # refused rather than stored in plaintext. The read tools are unaffected.
      FMCP_SECRET_ENCRYPTION_KEY: ${FMCP_SECRET_ENCRYPTION_KEY:-}

      # ── Legal and the MCP registry (S7-11, S7-12) ───────────────────────
      FMCP_SUPPORT_EMAIL: ${FMCP_SUPPORT_EMAIL:-support@fanmoot.com}
      FMCP_REGISTRY_AUTH: ${FMCP_REGISTRY_AUTH:-}

      # ── Cache warming (S7-2) ────────────────────────────────────────────
      FMCP_WARM_CACHES: ${FMCP_WARM_CACHES:-true}
      FMCP_WARM_INTERVAL_S: ${FMCP_WARM_INTERVAL_S:-5}

      # ── Voice and match_mood (S3) ───────────────────────────────────────
      FMCP_VOICE_TIMEZONE: ${FMCP_VOICE_TIMEZONE:-Europe/London}
      FMCP_BEDROCK_MODEL_ID: ${FMCP_BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}
      FMCP_BEDROCK_REGION: ${FMCP_BEDROCK_REGION:-us-east-1}
      # Bedrock credentials come from the standard AWS chain. On a Dokploy host
      # with no instance role, these three are how that chain is fed.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

    expose:
      - "8080"

    # Migrations run before the server accepts traffic, in one place, so a
    # deploy can never serve requests against a schema it does not match.
    # `--preload` is deliberately absent: gunicorn would import the app before
    # forking, and the asyncpg pool must be created per worker.
    #
    # One worker — see the Dockerfile's CMD for why an MCP session cannot cross
    # a process boundary yet. No --access-logfile, for the reason given there:
    # the application logs every request itself, without the query string.
    command: >
      sh -c '
      alembic upgrade head &&
      exec gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8080
      --workers 1
      --timeout 90
      --graceful-timeout 30
      '

    # Lets the container reach a database or tunnel on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - dokploy-network

networks:
  # Created by Dokploy on its host. Locally, create it once by hand:
  #   docker network create dokploy-network
  dokploy-network:
    external: true
